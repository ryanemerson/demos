services:
  postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - keycloak-net
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    deploy:
      replicas: 2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - 8080
    depends_on:
      - postgres
    networks:
      - keycloak-net

    command:
      - start
      - --db=postgres
      - --db-url-host=postgres
      - --db-username=keycloak
      - --db-password=password
      - --health-enabled=true
      - --http-enabled=true
      - --hostname-strict=false

      # - --cache-embedded-mtls-enabled=false

      # - --cache-embedded-mtls-key-store-file=/opt/keystore.p12
      # - --cache-embedded-mtls-key-store-password=password1
      # - --cache-embedded-mtls-trust-store-file=/opt/truststore.p12
      # - --cache-embedded-mtls-trust-store-password=password1

    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 10s
    volumes:
      - ./tls/keystore.p12:/opt/keystore.p12
      - ./tls/truststore.p12:/opt/truststore.p12

networks:
  keycloak-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
