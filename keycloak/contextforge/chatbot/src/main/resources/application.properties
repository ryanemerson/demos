# MCP client — connects to the MCP server via the ContextForge gateway
quarkus.langchain4j.mcp.mcp-server.transport-type=streamable-http
quarkus.langchain4j.mcp.mcp-server.url=${MCP_SERVER_URL:http://localhost:4444/mcp}
quarkus.langchain4j.mcp.mcp-server.enabled=true

# OIDC settings (used by OidcAuthService for browser-based login)
app.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/demo}
app.oidc.client-id=${OIDC_CLIENT_ID:chatbot-cli}
app.oidc.redirect-uri=http://localhost:8080/callback
app.oidc.scopes=openid

# Ramalama local endpoint
quarkus.langchain4j.openai.base-url=http://localhost:8888/v1
quarkus.langchain4j.openai.api-key=dummy-key
quarkus.langchain4j.openai.enable-tool-call=true
quarkus.langchain4j.openai.timeout=60s

# Optional tuning parameters
quarkus.langchain4j.openai.max-tokens=2048
quarkus.langchain4j.openai.temperature=0.7

# Disable auto-shutdown for longer inference sessions
quarkus.langchain4j.shutdown-timeout-seconds=60