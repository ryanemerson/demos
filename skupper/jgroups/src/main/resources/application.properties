# JGroups Configuration
jgroups.cluster.name=quarkus-cluster
jgroups.tcpping.initial_hosts=localhost[7800]
jgroups.bind_port=7800
jgroups.bind_addr=loopback

# Quarkus Configuration
quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.console.level=TRACE
quarkus.log.category."com.example.jgroups".level=INFO
quarkus.log.category."org.jgroups.protocols".min-level=TRACE
quarkus.log.category."org.jgroups.protocols".level=TRACE
