# Vertex AI Anthropic LLM configuration
vertex-ai.project-id=${ANTHROPIC_VERTEX_PROJECT_ID}
vertex-ai.location=${CLOUD_ML_REGION:us-east5}
vertex-ai.model-name=${VERTEX_AI_MODEL:claude-opus-4-6}
vertex-ai.max-tokens=1024

# MCP client — connects to the secured MCP server
quarkus.langchain4j.mcp.mcp-server.transport-type=http
quarkus.langchain4j.mcp.mcp-server.url=${MCP_SERVER_URL:http://localhost:8085/mcp/sse}

# OIDC settings (used by OidcAuthService for browser-based login)
app.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/demo}
app.oidc.client-id=${OIDC_CLIENT_ID:chatbot-cli}
app.oidc.redirect-uri=http://localhost:8080/callback
app.oidc.scopes=openid

