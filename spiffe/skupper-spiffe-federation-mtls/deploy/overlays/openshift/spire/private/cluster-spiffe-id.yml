apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: hello-server
spec:
  className: zero-trust-workload-identity-manager-spire
  spiffeIDTemplate: "spiffe://private.demo.example.com/hello-server"
  podSelector:
    matchLabels:
      app: hello-server
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: server
  dnsNameTemplates:
    - "hello-server.client.svc.cluster.local"
  federatesWith:
    - "public.demo.example.com"
