# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Allow local unix socket connections (used by pg_isready healthcheck)
local   all             all                                     trust

# Require mTLS for all TCP connections: the client must present a certificate
# signed by the trusted CA (SPIFFE trust bundle) whose CN matches the
# database username. No password required — the certificate is the credential.
hostssl all             all             0.0.0.0/0               cert
hostssl all             all             ::/0                    cert

# Explicitly reject all non-SSL TCP connections
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
