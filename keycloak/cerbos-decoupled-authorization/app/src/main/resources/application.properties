# OIDC Configuration
quarkus.oidc.auth-server-url=http://localhost:8080/realms/demo
quarkus.oidc.client-id=authorization-demo
quarkus.oidc.credentials.secret=authorization-demo-secret
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.token.issuer=http://localhost:8080/realms/demo

# Keycloak Admin Client
quarkus.keycloak.admin-client.server-url=http://localhost:8080
quarkus.keycloak.admin-client.realm=demo
quarkus.keycloak.admin-client.client-id=authorization-demo
quarkus.keycloak.admin-client.client-secret=authorization-demo-secret
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# AuthZen PDP (Cerbos)
authzen.scheme=http
authzen.host=localhost
authzen.port=3592

# HTTP
quarkus.http.port=8081
