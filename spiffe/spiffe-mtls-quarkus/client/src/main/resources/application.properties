# SPIRE Workload API socket path.
# Override with env var SPIRE_SOCKET_PATH
spire.socket.path=unix:/run/spire/sockets/agent.sock

# Directory where SpiffeService writes SPIFFE PEM files.
# The spiffe-init container pre-populates this before the app starts.
spiffe.cert.dir=/opt/spiffe-certs

# --- WebClient (hello-server) ---
# Used by HelloScheduler to build a Vert.x WebClient with SPIFFE mTLS.
# PEM files are loaded directly; setVerifyHost(false) bypasses the DNS hostname
# check that would reject SPIFFE URI SANs.
hello.server.url=https://hello-server.server.svc.cluster.local:8443

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."com.example.spiffe".level=DEBUG

# java-spiffe bundle fetching and SVID updates
quarkus.log.category."io.spiffe".level=DEBUG
