# MCP Server configuration
quarkus.mcp.server.server-info.name=Demo MCP Server

# HTTP port
quarkus.http.port=8085

# OIDC bearer token validation
quarkus.oidc.auth-server-url=http://localhost:8180/realms/demo
quarkus.oidc.client-id=mcp-server
quarkus.oidc.credentials.secret=mcp-server-secret
quarkus.oidc.tls.verification=none

# Secure all MCP endpoints — reject unauthenticated requests
quarkus.http.auth.permission.authenticated.paths=/mcp/*
quarkus.http.auth.permission.authenticated.policy=authenticated
