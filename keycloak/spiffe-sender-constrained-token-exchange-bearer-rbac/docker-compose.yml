services:
  # ============================================================
  # SPIRE Infrastructure
  # ============================================================
  spire-server:
    container_name: spire-server
    image: ghcr.io/spiffe/spire-server:1.12.0
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  spire-init:
    container_name: spire-init
    build:
      context: ./spire
      dockerfile: Dockerfile.init
    entrypoint: ["/bin/sh", "/opt/spire/init.sh"]
    volumes:
      - ./spire/init.sh:/opt/spire/init.sh:ro
      - spire-server-socket:/tmp/spire-server/private
      - spire-join-token:/run/spire/join-token
    depends_on:
      spire-server:
        condition: service_healthy

  spire-agent:
    container_name: spire-agent
    build:
      context: ./spire
      dockerfile: Dockerfile.agent
    entrypoint: ["/bin/sh", "/opt/spire/agent-entrypoint.sh"]
    pid: host
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spire/agent-entrypoint.sh:/opt/spire/agent-entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - spire-join-token:/run/spire/join-token:ro
      - spire-agent-socket:/run/spire/sockets
    depends_on:
      spire-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9982/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # ============================================================
  # spiffe-helper containers (one per workload)
  # ============================================================
  spiffe-helper-keycloak:
    container_name: spiffe-helper-keycloak
    build:
      context: ./spire
      dockerfile: Dockerfile.helper
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    labels:
      spiffe-workload: keycloak
    volumes:
      - ./keycloak/spiffe-helper.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-socket:/run/spire/sockets:ro
      - keycloak-certs:/opt/spiffe-certs
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/opt/spiffe-certs/svid.pem"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  spiffe-helper-frontend:
    container_name: spiffe-helper-frontend
    build:
      context: ./spire
      dockerfile: Dockerfile.helper
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    labels:
      spiffe-workload: frontend
    volumes:
      - ./frontend/spiffe-helper.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-socket:/run/spire/sockets:ro
      - frontend-certs:/opt/spiffe-certs
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/opt/spiffe-certs/svid.pem"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  spiffe-helper-microservice1:
    container_name: spiffe-helper-microservice1
    build:
      context: ./spire
      dockerfile: Dockerfile.helper
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    labels:
      spiffe-workload: microservice1
    volumes:
      - ./microservice1/spiffe-helper.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-socket:/run/spire/sockets:ro
      - microservice1-certs:/opt/spiffe-certs
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/opt/spiffe-certs/svid.pem"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  spiffe-helper-microservice2:
    container_name: spiffe-helper-microservice2
    build:
      context: ./spire
      dockerfile: Dockerfile.helper
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    labels:
      spiffe-workload: microservice2
    volumes:
      - ./microservice2/spiffe-helper.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-socket:/run/spire/sockets:ro
      - microservice2-certs:/opt/spiffe-certs
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/opt/spiffe-certs/svid.pem"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # ============================================================
  # Application Services
  # ============================================================
  keycloak:
    container_name: keycloak
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command:
      - start-dev
      - --import-realm
    environment:
      JAVA_OPTS_APPEND: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: https://localhost:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/spiffe-certs/svid.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/spiffe-certs/svid_key.pem
      KC_TRUSTSTORE_PATHS: /opt/spiffe-certs/bundle.pem
      KC_HTTPS_CLIENT_AUTH: request
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: 8443
      DEBUG: "true"
      DEBUG_PORT: "*:5005"
    ports:
      - "8443:8443"
      - "5005:5005"
    volumes:
      - ./keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
      - keycloak-certs:/opt/spiffe-certs:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      spiffe-helper-keycloak:
        condition: service_healthy

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:8443"
    environment:
      QUARKUS_OIDC_AUTH_SERVER_URL: https://keycloak:8443/realms/demo
      QUARKUS_OIDC_TOKEN_ISSUER: any
      QUARKUS_REST_CLIENT_MICROSERVICE1_URL: https://microservice1:8443
    volumes:
      - frontend-certs:/opt/spiffe-certs:ro
    depends_on:
      keycloak:
        condition: service_healthy
      spiffe-helper-frontend:
        condition: service_healthy

  microservice1:
    container_name: microservice1
    build:
      context: .
      dockerfile: microservice1/Dockerfile
    ports:
      - "8082:8443"
    environment:
      QUARKUS_OIDC_AUTH_SERVER_URL: https://keycloak:8443/realms/demo
      QUARKUS_OIDC_TOKEN_ISSUER: any
      QUARKUS_REST_CLIENT_MICROSERVICE2_URL: https://microservice2:8443
    volumes:
      - microservice1-certs:/opt/spiffe-certs:ro
    depends_on:
      keycloak:
        condition: service_healthy
      spiffe-helper-microservice1:
        condition: service_healthy

  microservice2:
    container_name: microservice2
    build:
      context: .
      dockerfile: microservice2/Dockerfile
    ports:
      - "8083:8443"
    environment:
      QUARKUS_OIDC_AUTH_SERVER_URL: https://keycloak:8443/realms/demo
      QUARKUS_OIDC_TOKEN_ISSUER: any
    volumes:
      - microservice2-certs:/opt/spiffe-certs:ro
    depends_on:
      keycloak:
        condition: service_healthy
      spiffe-helper-microservice2:
        condition: service_healthy

volumes:
  spire-server-socket:
  spire-join-token:
  spire-agent-socket:
  keycloak-certs:
  frontend-certs:
  microservice1-certs:
  microservice2-certs:
