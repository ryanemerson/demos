<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logged Out</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; text-align: center; }
        .container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #007bff; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .button {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
<div class="container">
    <h1>You have been successfully logged out.</h1>
    <p>Thank you for using the application.</p>
    <p><a href="/" class="button">Go to Homepage</a></p>
</div>
</body>
</html>
