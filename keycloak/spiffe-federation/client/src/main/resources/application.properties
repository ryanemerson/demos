server.url=https://hello-server.server.svc.cluster.local:8443

# Directory where the spiffe-helper sidecar writes SPIFFE PEM files.
spiffe.cert.dir=/opt/spiffe-certs

# --- TLS configuration (Quarkus TLS Registry) ---
# Used for both the HTTPS server and outbound mTLS HttpClient connections.
quarkus.tls.spiffe.key-store.pem.0.cert=${spiffe.cert.dir}/svid.pem
quarkus.tls.spiffe.key-store.pem.0.key=${spiffe.cert.dir}/svid_key.pem
quarkus.tls.spiffe.trust-store.pem.certs=${spiffe.cert.dir}/bundle.pem
quarkus.tls.spiffe.reload-period=5m

# --- HTTP server ---
quarkus.http.host=0.0.0.0
quarkus.http.port=-1
quarkus.http.ssl-port=8443
quarkus.http.tls-configuration-name=spiffe
quarkus.http.insecure-requests=disabled

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."com.example.spiffe".level=DEBUG

# java-spiffe bundle fetching and SVID updates
quarkus.log.category."io.spiffe".level=DEBUG
