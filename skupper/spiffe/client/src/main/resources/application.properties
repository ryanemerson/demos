# SPIRE Workload API socket path.
# Override with env var SPIRE_SOCKET_PATH (West site: /run/spire/west/agent.sock)
spire.socket.path=unix:/run/spire/sockets/agent.sock

# Directory where SpiffeService writes SPIFFE PEM files.
# The spiffe-init container pre-populates this before the app starts.
spiffe.cert.dir=/opt/spiffe-certs
# Federated peer trust domain — its CA is included in bundle.0.pem for cross-domain mTLS.
spiffe.federated.trust.domain=east.demo.example.com

# --- TLS configuration (Quarkus TLS Registry) ---
# Reads PEM files written by SpiffeService / spiffe-init container.
# reload-period causes Quarkus to re-read the files after each SPIRE cert rotation.
quarkus.tls.spiffe.key-store.pem.0.cert=${spiffe.cert.dir}/svid.0.pem
quarkus.tls.spiffe.key-store.pem.0.key=${spiffe.cert.dir}/svid.0.key
# Two separate files: spire-agent writes bundle.0.pem (own CA) and
# federated_bundle.0.0.pem (peer CA) separately. Using two files avoids
# relying on Quarkus parsing multiple PEM blocks from a single file.
quarkus.tls.spiffe.trust-store.pem.certs=${spiffe.cert.dir}/bundle.0.pem,${spiffe.cert.dir}/federated_bundle.0.0.pem
quarkus.tls.spiffe.reload-period=5s

# --- REST client ---
# hello-server is reachable via the Skupper Listener created in site-west.
# The Listener maps hello-server:8443 -> Skupper network -> site-east connector.
quarkus.rest-client.hello-server.url=https://hello-server:8443
quarkus.rest-client.hello-server.tls-configuration-name=spiffe
# SPIFFE certificates use URI SANs (spiffe://...), not DNS hostnames.
# Disable Vert.x host verification so the JDK TrustManager does not apply the
# HTTPS endpoint identification algorithm (X509TrustManagerImpl.checkIdentity).
# Trust is still fully enforced via mutual TLS certificate chain verification.
quarkus.rest-client.hello-server.verify-host=false

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."com.example.spiffe".level=DEBUG

# TLS registry file reloading and cert loading
quarkus.log.category."io.quarkus.tls".level=DEBUG
# java-spiffe bundle fetching and SVID updates
quarkus.log.category."io.spiffe".level=DEBUG
