# --- TLS configuration (Quarkus TLS Registry) ---
# Reads PEM files written by the spiffe-helper sidecar.
# reload-period causes Quarkus to re-read the files after each SPIRE cert rotation.
quarkus.tls.spiffe.key-store.pem.0.cert=/opt/spiffe-certs/svid.pem
quarkus.tls.spiffe.key-store.pem.0.key=/opt/spiffe-certs/svid_key.pem
quarkus.tls.spiffe.trust-store.pem.certs=/opt/spiffe-certs/bundle.pem
quarkus.tls.spiffe.reload-period=5m

# --- HTTP server ---
quarkus.http.host=0.0.0.0
# Disable plain HTTP; serve only HTTPS with mutual TLS.
quarkus.http.port=-1
quarkus.http.ssl-port=8443
quarkus.http.tls-configuration-name=spiffe
# Require client certificates (mutual TLS)
quarkus.http.insecure-requests=disabled
quarkus.http.ssl.client-auth=required

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."com.example.spiffe".level=DEBUG
# TLS registry file reloading and cert loading
quarkus.log.category."io.quarkus.tls".level=DEBUG
quarkus.log.category."io.quarkus.vertx.http.runtime.HttpCertificateUpdateEventListener".level=WARN
quarkus.log.category."io.quarkus.oidc.runtime".level=TRACE
quarkus.log.category."io.quarkus.oidc.runtime".min-level=TRACE