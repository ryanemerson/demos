services:
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: keycloak
    command:
      - start
      - --import-realm
    environment:
      KC_DB: dev-file
      KC_FEATURES: scripts
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json
    ports:
      - "8080:8080"
    networks:
      - demo-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  authorization-demo:
    container_name: demo
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/demo
      QUARKUS_KEYCLOAK_ADMIN_CLIENT_SERVER_URL: http://keycloak:8080
      QUARKUS_HTTP_PORT: 8081
    ports:
      - "8081:8081"
      - "5005:5005"
    networks:
      - demo-net
    depends_on:
      keycloak:
        condition: service_healthy

networks:
  demo-net:
    driver: bridge
