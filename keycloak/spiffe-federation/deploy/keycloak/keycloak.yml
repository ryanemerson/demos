apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  ports:
    - name: https
      port: 8443
      targetPort: 8443
  selector:
    app: keycloak
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: keycloak
  name: keycloak-discovery
  namespace: keycloak
spec:
  selector:
    app: keycloak
  clusterIP: None
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-config
  namespace: keycloak
data:
  helper.conf: |
    agent_address = "/run/spire/sockets/agent.sock"
    cert_dir = "/opt/spiffe-certs"
    daemon_mode = true

    health_checks {
      listener_enabled = true
    }

    svid_file_name = "svid.pem"
    svid_key_file_name = "svid_key.pem"
    svid_bundle_file_name = "bundle.pem"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  serviceName: keycloak-discovery
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        # Sidecar to continuously fetch and update the X.509 SVID and trust bundle via the Workload API.
        # Writes: svid.pem (cert chain), svid_key.pem (private key), bundle.pem (trust bundle).
        - name: spiffe-helper
          image: ghcr.io/spiffe/spiffe-helper:0.11.0
          args: ["-config", "/opt/spiffe-helper/helper.conf"]
          # Continue to execute as a sidecar
          restartPolicy: Always
          securityContext:
            runAsUser: 1000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
            - name: spiffe-certs
              mountPath: /opt/spiffe-certs
            - name: spiffe-helper-config
              mountPath: /opt/spiffe-helper
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:nightly
          args: ["start"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_FEATURES
              value: "client-auth-federated,spiffe"
            - name: KC_HOSTNAME
              value: "keycloak.keycloak.svc.cluster.local"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_DB
              value: "dev-file"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: "/opt/spiffe-certs/svid.pem"
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: "/opt/spiffe-certs/svid_key.pem"
            - name: KC_TRUSTSTORE_PATHS
              value: "/opt/spiffe-certs/bundle.pem"
            # SPIRE default expiration
            # Signing CA 24hr - Rotate every 12hr
            # X.509-SVIDs 1hr - Rotate every 30m
            # JWT-SVIDs 5m
            - name: KC_HTTPS_CERTIFICATES_RELOAD_PERIOD
              value: "25m"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTPS
          volumeMounts:
            - name: spiffe-certs
              mountPath: /opt/spiffe-certs
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/socket
            type: DirectoryOrCreate
        - name: spiffe-certs
          emptyDir: {}
        - name: spiffe-helper-config
          configMap:
            name: spiffe-helper-config