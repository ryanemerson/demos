services:

  # ──────────────────────────────────────────────
  # SPIRE Server
  # ──────────────────────────────────────────────
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.12.0
    hostname: spire-server
    command: ["-config", "/opt/spire/conf/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server.conf:ro
      - spire-server-socket:/run/spire
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/server.sock"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ──────────────────────────────────────────────
  # SPIRE Init — registers workloads & generates join token
  # ──────────────────────────────────────────────
  spire-init:
    build:
      context: ./spire
      dockerfile: Dockerfile.init
    command: ["/bin/sh", "/opt/spire/init.sh"]
    volumes:
      - ./spire/init.sh:/opt/spire/init.sh:ro
      - spire-server-socket:/run/spire
      - spire-join-token:/run/spire/join-token
    depends_on:
      spire-server:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # SPIRE Agent — attests workloads via Docker labels
  # ──────────────────────────────────────────────
  spire-agent:
    build:
      context: ./spire
      dockerfile: Dockerfile.agent
    command: ["/bin/sh", "/opt/spire/agent-entrypoint.sh"]
    pid: "host"
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent.conf:ro
      - ./spire/agent-entrypoint.sh:/opt/spire/agent-entrypoint.sh:ro
      - spire-agent-socket:/run/spire/sockets
      - spire-join-token:/run/spire/join-token:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      spire-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ──────────────────────────────────────────────
  # java-spiffe-helper for Keycloak — provisions PKCS12 keystores
  # ──────────────────────────────────────────────
  java-spiffe-helper-keycloak:
    image: ghcr.io/spiffe/java-spiffe-helper:0.8.16
    command: ["-c", "/opt/java-spiffe-helper/helper.properties"]
    user: "0"
    labels:
      spiffe-workload: keycloak
    volumes:
      - ./keycloak/java-spiffe-helper.properties:/opt/java-spiffe-helper/helper.properties:ro
      - spire-agent-socket:/run/spire/sockets:ro
      - keycloak-certs:/opt/spiffe-certs
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/opt/spiffe-certs/keystore.p12"]
      interval: 2s
      timeout: 2s
      retries: 30

  # ──────────────────────────────────────────────
  # spiffe-helper for MySQL
  # ──────────────────────────────────────────────
  spiffe-helper-mysql:
    image: ghcr.io/spiffe/spiffe-helper:0.11.0
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    labels:
      spiffe-workload: mysql
    volumes:
      - ./mysql/spiffe-helper.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-socket:/run/spire/sockets:ro
      - mysql-certs:/opt/spiffe-certs
    depends_on:
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/opt/spiffe-certs/server.crt"]
      interval: 2s
      timeout: 2s
      retries: 30

  # ──────────────────────────────────────────────
  # MySQL 8.4 with mTLS
  # ──────────────────────────────────────────────
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    hostname: mysql
    entrypoint: ["/usr/local/bin/mysql-entrypoint.sh"]
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak  # required by official entrypoint; init.sql recreates user without password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-certs:/opt/spiffe-certs
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      spiffe-helper-mysql:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Keycloak nightly — connects to MySQL over mTLS
  # ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:nightly
    hostname: keycloak
    command: ["start-dev"]
    environment:
      # Database connection with mTLS
      KC_DB: mysql
      KC_DB_URL: "jdbc:mysql://mysql:3306/keycloak?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:///opt/spiffe-certs/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&clientCertificateKeyStoreUrl=file:///opt/spiffe-certs/keystore.p12&clientCertificateKeyStoreType=PKCS12&clientCertificateKeyStorePassword=changeit"
      KC_DB_USERNAME: keycloak

      # Dev mode settings
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak-certs:/opt/spiffe-certs
    depends_on:
      java-spiffe-helper-keycloak:
        condition: service_healthy
      mysql:
        condition: service_healthy

volumes:
  spire-server-socket:
  spire-join-token:
  spire-agent-socket:
  keycloak-certs:
  mysql-certs:
  mysql-data:
