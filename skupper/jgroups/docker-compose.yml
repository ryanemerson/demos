version: '3.8'

services:
  node1:
    build: .
    container_name: jgroups-node1
    hostname: node1
    ports:
      - "8080:8080"
    environment:
      - jgroups.cluster.name=docker-cluster
      - jgroups.tcpping.initial_hosts=node1[7800],node2[7800],node3[7800]
      - jgroups.bind_addr=node1
      - jgroups.bind_port=7800
    networks:
      - jgroups-net

  node2:
    build: .
    container_name: jgroups-node2
    hostname: node2
    ports:
      - "8081:8080"
    environment:
      - jgroups.cluster.name=docker-cluster
      - jgroups.tcpping.initial_hosts=node1[7800],node2[7800],node3[7800]
      - jgroups.bind_addr=node2
      - jgroups.bind_port=7800
    networks:
      - jgroups-net

  node3:
    build: .
    container_name: jgroups-node3
    hostname: node3
    ports:
      - "8082:8080"
    environment:
      - jgroups.cluster.name=docker-cluster
      - jgroups.tcpping.initial_hosts=node1[7800],node2[7800],node3[7800]
      - jgroups.bind_addr=node3
      - jgroups.bind_port=7800
    networks:
      - jgroups-net

networks:
  jgroups-net:
    driver: bridge
